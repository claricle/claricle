AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  # Add to RuboCop's default Exclude rather than replacing it, which would
  # drop the *.gemspec exemption.
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'spec/**/*'
