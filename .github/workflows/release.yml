name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version: x.y.z / major / minor / patch / pre|rc|etc,
          or 'skip' to push the current versions without a version bump or tag.
        required: true
        default: 'skip'

# Least-privilege ceiling for the called rubygems-release.yml: its release job
# needs contents:write (git tag push) and id-token:write (OIDC Trusted Publishing).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
